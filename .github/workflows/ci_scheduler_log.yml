name: CI Scheduler Log (retired)

# This manual-only legacy scaffold used an unmaintained mutable image and stale
# build paths. It now fails before checkout or candidate execution. Maintained
# validation is owned by CI Healthcheck and CI Integration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject retired workflow
        run: |
          echo "CI Scheduler Log is retired; use the stable healthcheck/integration workflows." >&2
          exit 1
