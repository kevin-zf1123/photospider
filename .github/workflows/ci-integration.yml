name: CI Integration

on:
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main
      - 'CI/**'
  workflow_dispatch:

permissions:
  attestations: read
  contents: read
  packages: read

jobs:
  protected-ci-paths:
    if: >-
      ${{
        github.event_name != 'pull_request_target' ||
        !startsWith(github.head_ref, 'CI/') ||
        github.event.pull_request.head.repo.full_name != github.repository
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject fork pull request before checkout
        if: >-
          ${{
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name != github.repository
          }}
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/photospider-protected-ci-paths-${{ github.run_id }}-${{ github.run_attempt }}
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -Eeuo pipefail
          if [[ -e "$CI_ARTIFACT_DIR" || -L "$CI_ARTIFACT_DIR" ]]; then
            echo "Protected-path artifact directory already exists or aliases another object." >&2
            exit 1
          fi
          mkdir -m 700 -- "$CI_ARTIFACT_DIR"
          if [[ ! -d "$CI_ARTIFACT_DIR" || -L "$CI_ARTIFACT_DIR" ]]; then
            echo "Protected-path artifact directory is not a fresh real directory." >&2
            exit 1
          fi
          {
            echo "Fork pull requests are rejected before checkout."
            echo "A pull_request_target workflow must never execute fork head code with base-repository credentials."
            echo "Same-repository CI/** branches remain covered by the push-triggered workflow."
            echo "Received head repository: '${CI_HEAD_REPOSITORY:-unavailable}'."
          } | tee "$CI_ARTIFACT_DIR/summary.log" >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}

      - name: Protect CI workflow paths
        env:
          CI_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          CI_HEAD_IS_BASE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name == github.repository }}
          CI_BASE_BRANCH: ${{ github.base_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_RUNNER_TEMP: ${{ runner.temp }}
          CI_ARTIFACT_DIR: ${{ runner.temp }}/photospider-protected-ci-paths-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail

          # @brief Create the direct runner.temp child used by the protected guard.
          # @return Zero only for a new mode-0700 real directory with no alias.
          # @throws Nothing; missing runner.temp, residual paths, links, special
          #   files, or a resolved directory outside runner.temp return nonzero.
          prepare_guard_directory() {
            local runner_temp_real
            local artifact_real
            if [[ -L "$CI_RUNNER_TEMP" || ! -d "$CI_RUNNER_TEMP" ]]; then
              echo "runner.temp is missing or not a real directory." >&2
              return 1
            fi
            runner_temp_real=$(cd -- "$CI_RUNNER_TEMP" && pwd -P)
            if [[ -e "$CI_ARTIFACT_DIR" || -L "$CI_ARTIFACT_DIR" ]]; then
              echo "Protected-path artifact directory contains residual or aliased state." >&2
              return 1
            fi
            mkdir -m 700 -- "$CI_ARTIFACT_DIR"
            if [[ ! -d "$CI_ARTIFACT_DIR" || -L "$CI_ARTIFACT_DIR" ]]; then
              echo "Protected-path artifact directory is not a fresh real directory." >&2
              return 1
            fi
            artifact_real=$(cd -- "$CI_ARTIFACT_DIR" && pwd -P)
            if [[ ${artifact_real%/*} != "$runner_temp_real" ]]; then
              echo "Protected-path artifact directory is not a direct runner.temp child." >&2
              return 1
            fi
          }

          # @brief Create one empty guard-owned evidence file without following links.
          # @param $1 Exact basename below the verified artifact directory.
          # @return Zero only after a new regular non-symlink file is created.
          # @throws Nothing; residual, link, directory, FIFO, or device targets fail.
          create_guard_file() {
            local target="$CI_ARTIFACT_DIR/$1"
            if [[ -e "$target" || -L "$target" ]]; then
              echo "Protected-path evidence target is residual or aliased: $1" >&2
              return 1
            fi
            (umask 077; : > "$target")
            if [[ ! -f "$target" || -L "$target" ]]; then
              echo "Protected-path evidence target is not a regular file: $1" >&2
              return 1
            fi
          }

          # @brief Revalidate one evidence file immediately before or after I/O.
          # @param $1 Exact basename below the verified artifact directory.
          # @return Zero only for a regular non-symlink file.
          # @throws Nothing; replacement by a link or special file returns nonzero.
          require_guard_file() {
            local target="$CI_ARTIFACT_DIR/$1"
            if [[ ! -f "$target" || -L "$target" ]]; then
              echo "Protected-path evidence file changed type or disappeared: $1" >&2
              return 1
            fi
          }

          prepare_guard_directory
          for evidence_file in \
            changed-files.z \
            changed-files.txt \
            merge-bases.txt \
            protected-files.txt \
            summary.log; do
            create_guard_file "$evidence_file"
          done

          if [[ "$CI_EVENT_NAME" == "push" && "$CI_BRANCH_NAME" == "main" ]]; then
            echo "main branch push may update CI workflow files." |
              tee "$CI_ARTIFACT_DIR/summary.log"
            exit 0
          fi
          if [[ "$CI_BRANCH_NAME" == CI/* &&
            (
              "$CI_EVENT_NAME" == push ||
              "$CI_EVENT_NAME" == workflow_dispatch ||
              (
                "$CI_EVENT_NAME" == pull_request_target &&
                -n "$CI_HEAD_REPOSITORY" &&
                "$CI_HEAD_IS_BASE_REPOSITORY" == true
              )
            ) ]]; then
            echo "CI branch '$CI_BRANCH_NAME' may update CI workflow files." |
              tee "$CI_ARTIFACT_DIR/summary.log"
            exit 0
          fi

          diff_candidate_base=origin/main
          diff_head=HEAD
          if [[ "$CI_EVENT_NAME" == pull_request ||
            "$CI_EVENT_NAME" == pull_request_target ]]; then
            git fetch --no-tags --no-recurse-submodules \
              "https://github.com/${CI_BASE_REPOSITORY}.git" \
              "+refs/heads/${CI_BASE_BRANCH}:refs/remotes/photospider-base/${CI_BASE_BRANCH}"
            diff_candidate_base=$CI_BASE_SHA
            diff_head=$CI_HEAD_SHA
          else
            git fetch --no-tags --prune origin main
          fi

          git rev-parse --verify "$diff_candidate_base^{commit}" >/dev/null
          git rev-parse --verify "$diff_head^{commit}" >/dev/null
          require_guard_file merge-bases.txt
          if ! git merge-base --all "$diff_candidate_base" "$diff_head" \
            > "$CI_ARTIFACT_DIR/merge-bases.txt"; then
            echo "Protected-path merge-base detection failed." >&2
            exit 1
          fi
          require_guard_file merge-bases.txt
          mapfile -t merge_bases < "$CI_ARTIFACT_DIR/merge-bases.txt"
          if ((${#merge_bases[@]} != 1)); then
            echo "Protected-path comparison requires exactly one merge base." >&2
            exit 1
          fi
          diff_base=${merge_bases[0]}

          require_guard_file changed-files.z
          if ! git diff --no-renames --name-only -z \
            "$diff_base" "$diff_head" \
            > "$CI_ARTIFACT_DIR/changed-files.z"; then
            echo "Protected-path changed-path detection failed." >&2
            exit 1
          fi
          require_guard_file changed-files.z
          changed_files=()
          if ! mapfile -d '' -t changed_files \
            < "$CI_ARTIFACT_DIR/changed-files.z"; then
            echo "Protected-path changed-path inventory read failed." >&2
            exit 1
          fi
          require_guard_file changed-files.txt
          require_guard_file protected-files.txt
          for changed_file in "${changed_files[@]}"; do
            printf '%q\n' "$changed_file" \
              >> "$CI_ARTIFACT_DIR/changed-files.txt"
            case "$changed_file" in
              Dockerfile.ci | .dockerignore | ci/* | .github/workflows/*)
                printf '%q\n' "$changed_file" \
                  >> "$CI_ARTIFACT_DIR/protected-files.txt"
                ;;
            esac
          done
          require_guard_file changed-files.txt
          require_guard_file protected-files.txt

          if [[ -s "$CI_ARTIFACT_DIR/protected-files.txt" ]]; then
            require_guard_file summary.log
            {
              echo "Only trusted base-repository CI/** runs may change ci/, .github/workflows/, Dockerfile.ci, or .dockerignore."
              echo "Develop CI workflow changes on a CI/** branch in '$CI_BASE_REPOSITORY'."
            } | tee "$CI_ARTIFACT_DIR/summary.log" >&2
            require_guard_file summary.log
            exit 1
          fi

          require_guard_file summary.log
          echo "No protected CI workflow paths changed on '$CI_BRANCH_NAME'." |
            tee "$CI_ARTIFACT_DIR/summary.log"
          require_guard_file summary.log

      - name: Upload protected path logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-protected-ci-paths
          path: ${{ runner.temp }}/photospider-protected-ci-paths-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

  ruleset-readback:
    needs: protected-ci-paths
    if: needs.protected-ci-paths.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      - name: Read live default-branch ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RULESET_ARTIFACT_DIR: ${{ runner.temp }}/photospider-ruleset-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ -e "$CI_RULESET_ARTIFACT_DIR" || -L "$CI_RULESET_ARTIFACT_DIR" ]]; then
            echo "Ruleset artifact directory contains residual or aliased state." >&2
            exit 1
          fi
          mkdir -m 700 -- "$CI_RULESET_ARTIFACT_DIR"
          python3 ci/scripts/ruleset_readback.py \
            --repository "$GITHUB_REPOSITORY" \
            --output "$CI_RULESET_ARTIFACT_DIR/ruleset-readback.json"
      - name: Upload live ruleset readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-ruleset-readback
          path: ${{ runner.temp }}/photospider-ruleset-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

  change-classification:
    needs: protected-ci-paths
    if: needs.protected-ci-paths.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_integration: ${{ steps.classify.outputs.run_integration }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pull request base history
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          if ! git fetch --no-tags --no-recurse-submodules \
            "https://github.com/${CI_BASE_REPOSITORY}.git" \
            "+refs/heads/${CI_BASE_BRANCH}:refs/remotes/photospider-base/${CI_BASE_BRANCH}"; then
            echo "Base history fetch failed; classification will require full integration." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Classify changed paths
        id: classify
        env:
          CI_CHANGE_EVENT: ${{ github.event_name }}
          CI_CHANGE_BRANCH: ${{ github.ref_name }}
          CI_CHANGE_BASE_SHA: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.base.sha || github.event.before }}
          CI_CHANGE_HEAD_SHA: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.event_name == 'push' && github.event.after || github.sha }}
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/change-classification
        run: bash ci/scripts/change_classification.sh
      - name: Upload change classification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-change-classification
          path: CI-results/change-classification
          if-no-files-found: warn

  ci-image-change:
    needs: change-classification
    if: >-
      ${{
        needs.change-classification.result == 'success' &&
        needs.change-classification.outputs.run_integration == 'true'
      }}
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pull request base history
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_BASE_BRANCH: ${{ github.base_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --no-recurse-submodules \
            "https://github.com/${CI_BASE_REPOSITORY}.git" \
            "+refs/heads/${CI_BASE_BRANCH}:refs/remotes/photospider-base/${CI_BASE_BRANCH}"
          git rev-parse --verify "$CI_BASE_SHA^{commit}" >/dev/null
      - name: Fetch CI branch main history
        if: github.event_name == 'push' && startsWith(github.ref_name, 'CI/')
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --prune origin main
      - name: Detect CI image input changes
        id: detect
        env:
          CI_IMAGE_BASE_REF: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.base.sha || (github.event_name == 'push' && startsWith(github.ref_name, 'CI/')) && 'origin/main' || github.event.before }}
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/ci-image-change
        run: bash ci/scripts/ci_image_changed.sh
      - name: Upload CI image change logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-ci-image-change
          path: CI-results/ci-image-change
          if-no-files-found: warn

  ci-image-identity:
    needs: ci-image-change
    if: needs.ci-image-change.outputs.changed == 'false'
    runs-on: ubuntu-24.04
    outputs:
      attestation_signer_commit: ${{ steps.identity.outputs.attestation_signer_commit }}
      attestation_source_commit: ${{ steps.identity.outputs.attestation_source_commit }}
      digest: ${{ steps.identity.outputs.digest }}
      image: ${{ steps.identity.outputs.image }}
      manifest_digest: ${{ steps.identity.outputs.manifest_digest }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image identity
        id: identity
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/ci-image-identity
          CI_IMAGE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/scripts/ci_image_verify.sh
      - name: Upload image identity logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-ci-image-identity
          path: CI-results/ci-image-identity
          if-no-files-found: warn

  candidate-image-build:
    needs: [change-classification, ci-image-change]
    if: >-
      ${{
        needs.change-classification.outputs.run_integration == 'true' &&
        needs.ci-image-change.outputs.changed == 'true' &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/CI/'))
      }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-ci-image.yml
    with:
      candidate_commit: ${{ github.sha }}
      workflow_commit: ${{ github.workflow_sha }}

  published-image-integration-readonly:
    needs: [change-classification, ci-image-change, ci-image-identity]
    if: >-
      ${{
        needs.change-classification.outputs.run_integration == 'true' &&
        needs.ci-image-change.outputs.changed == 'false' &&
        needs.ci-image-identity.result == 'success' &&
        github.event_name != 'push'
      }}
    permissions:
      attestations: read
      contents: read
      packages: read
    uses: ./.github/workflows/ci-integration-suite.yml
    with:
      caller_event: ${{ github.event_name }}
      caller_ref: ${{ github.ref }}
      candidate_commit: ${{ github.event.pull_request.head.sha || github.sha }}
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      checkout_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      image_digest: ${{ needs.ci-image-identity.outputs.digest }}
      image_attestation_signer_commit: ${{ needs.ci-image-identity.outputs.attestation_signer_commit }}
      image_attestation_source_commit: ${{ needs.ci-image-identity.outputs.attestation_source_commit }}
      image_kind: published
      image_manifest_digest: ${{ needs.ci-image-identity.outputs.manifest_digest }}
      image_ref: ${{ needs.ci-image-identity.outputs.image }}
      image_source_commit: ${{ needs.ci-image-identity.outputs.source_commit }}
      profile: default
      publish_reusable_attestations: false
      workflow_commit: ${{ github.workflow_sha }}

  published-image-integration-trusted:
    needs: [change-classification, ci-image-change, ci-image-identity]
    if: >-
      ${{
        needs.change-classification.outputs.run_integration == 'true' &&
        needs.ci-image-change.outputs.changed == 'false' &&
        needs.ci-image-identity.result == 'success' &&
        github.event_name == 'push'
      }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/ci-integration-suite.yml
    with:
      caller_event: ${{ github.event_name }}
      caller_ref: ${{ github.ref }}
      candidate_commit: ${{ github.sha }}
      checkout_ref: ${{ github.sha }}
      checkout_repository: ${{ github.repository }}
      image_digest: ${{ needs.ci-image-identity.outputs.digest }}
      image_attestation_signer_commit: ${{ needs.ci-image-identity.outputs.attestation_signer_commit }}
      image_attestation_source_commit: ${{ needs.ci-image-identity.outputs.attestation_source_commit }}
      image_kind: published
      image_manifest_digest: ${{ needs.ci-image-identity.outputs.manifest_digest }}
      image_ref: ${{ needs.ci-image-identity.outputs.image }}
      image_source_commit: ${{ needs.ci-image-identity.outputs.source_commit }}
      profile: default
      publish_reusable_attestations: true
      workflow_commit: ${{ github.workflow_sha }}

  candidate-image-integration:
    needs: [change-classification, ci-image-change, candidate-image-build]
    if: >-
      ${{
        needs.change-classification.outputs.run_integration == 'true' &&
        needs.ci-image-change.outputs.changed == 'true' &&
        needs.candidate-image-build.result == 'success' &&
        github.event_name == 'push'
      }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/ci-integration-suite.yml
    with:
      caller_event: ${{ github.event_name }}
      caller_ref: ${{ github.ref }}
      candidate_commit: ${{ github.sha }}
      checkout_ref: ${{ github.sha }}
      checkout_repository: ${{ github.repository }}
      image_digest: ${{ needs.candidate-image-build.outputs.digest }}
      image_attestation_signer_commit: ${{ needs.candidate-image-build.outputs.attestation_signer_commit }}
      image_attestation_source_commit: ${{ needs.candidate-image-build.outputs.attestation_source_commit }}
      image_kind: candidate
      image_manifest_digest: ${{ needs.candidate-image-build.outputs.manifest_digest }}
      image_ref: ${{ needs.candidate-image-build.outputs.image_ref }}
      image_source_commit: ${{ needs.candidate-image-build.outputs.source_commit }}
      profile: default
      publish_reusable_attestations: true
      workflow_commit: ${{ github.workflow_sha }}

  promote-candidate-image:
    needs: [candidate-image-build, candidate-image-integration]
    if: >-
      ${{
        needs.candidate-image-build.result == 'success' &&
        needs.candidate-image-integration.result == 'success' &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/CI/'))
      }}
    outputs:
      status: ${{ steps.promote.outputs.status }}
    concurrency:
      group: photospider-ci-image-promotion-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact promotion identities
        env:
          CI_BUILT_DIGEST: ${{ needs.candidate-image-build.outputs.digest }}
          CI_RUNNER_IDENTITY_FILE: ${{ runner.temp }}/photospider-promotion-runner-${{ github.run_id }}-${{ github.run_attempt }}.json
          CI_SUITE_DIGEST: ${{ needs.candidate-image-integration.outputs.validated_image_digest }}
        run: |
          set -Eeuo pipefail
          if [[ "$CI_BUILT_DIGEST" != "$CI_SUITE_DIGEST" ]]; then
            echo "Shared suite digest differs from the build-once candidate." >&2
            exit 1
          fi
          python3 ci/scripts/ci_runner_verify.py \
            --platform Linux \
            --runner-label ubuntu-24.04 \
            --output "$CI_RUNNER_IDENTITY_FILE"
          python3 ci/scripts/ci_lock_verify.py
      - name: Log in to GHCR for same-digest promotion
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested digest without rebuilding
        id: promote
        env:
          CI_IMAGE_PROMOTION_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/ci-image-promotion
          CI_PROMOTION_BRANCH: ${{ github.ref_name }}
          CI_PROMOTION_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: >-
          bash ci/scripts/ci_image_promote.sh
          --repository "${{ github.repository }}"
          --image-ref "${{ needs.candidate-image-build.outputs.image_ref }}"
          --expected-digest "${{ needs.candidate-image-build.outputs.digest }}"
          --candidate-commit "${{ github.sha }}"
          --source-commit "${{ needs.candidate-image-build.outputs.source_commit }}"
          --workflow-commit "$CI_PROMOTION_WORKFLOW_COMMIT"
          --manifest-digest "${{ needs.candidate-image-build.outputs.manifest_digest }}"
          --builder-image-version "${{ needs.candidate-image-build.outputs.builder_image_version }}"
          --event-name "${{ github.event_name }}"
          --branch "$CI_PROMOTION_BRANCH"
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-image-promotion-results
          path: CI-results/ci-image-promotion
          if-no-files-found: warn

  integration:
    name: >-
      ${{ github.event_name == 'pull_request_target' && startsWith(github.head_ref, 'CI/') && github.event.pull_request.head.repo.full_name == github.repository && 'integration-pr-sentinel' || 'integration' }}
    needs:
      - protected-ci-paths
      - ruleset-readback
      - change-classification
      - ci-image-change
      - ci-image-identity
      - candidate-image-build
      - published-image-integration-readonly
      - published-image-integration-trusted
      - candidate-image-integration
      - promote-candidate-image
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report integration gate
        env:
          CI_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          CI_HEAD_IS_BASE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name == github.repository }}
          PROTECTED_RESULT: ${{ needs.protected-ci-paths.result }}
          RULESET_RESULT: ${{ needs.ruleset-readback.result }}
          CLASSIFICATION_RESULT: ${{ needs.change-classification.result }}
          DOCS_ONLY: ${{ needs.change-classification.outputs.docs_only }}
          RUN_INTEGRATION: ${{ needs.change-classification.outputs.run_integration }}
          CLASSIFICATION_REASON: ${{ needs.change-classification.outputs.reason }}
          IMAGE_CHANGE_RESULT: ${{ needs.ci-image-change.result }}
          IMAGE_CHANGED: ${{ needs.ci-image-change.outputs.changed }}
          IMAGE_IDENTITY_RESULT: ${{ needs.ci-image-identity.result }}
          CANDIDATE_BUILD_RESULT: ${{ needs.candidate-image-build.result }}
          CANDIDATE_SUITE_RESULT: ${{ needs.candidate-image-integration.result }}
          PROMOTION_RESULT: ${{ needs.promote-candidate-image.result }}
          PROMOTION_STATUS: ${{ needs.promote-candidate-image.outputs.status }}
          PUBLISHED_READONLY_RESULT: ${{ needs.published-image-integration-readonly.result }}
          PUBLISHED_TRUSTED_RESULT: ${{ needs.published-image-integration-trusted.result }}
        run: |
          set -Eeuo pipefail

          # @brief Require one named assertion value to match exactly.
          # @param $1 Stable assertion label used only for diagnostics.
          # @param $2 Actual value being asserted.
          # @param $3 Expected value.
          # @return Zero for an exact match, otherwise one with a diagnostic.
          require_value() {
            local assertion_label=$1
            local actual=$2
            local expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "$assertion_label was '$actual'; expected '$expected'." >&2
              return 1
            fi
          }

          # @brief Require every image-producing or shared-DAG route to skip.
          # @return Zero only when documentation-only routing performed no build.
          require_integration_routes_skipped() {
            require_value ci-image-identity "$IMAGE_IDENTITY_RESULT" skipped
            require_value candidate-image-build "$CANDIDATE_BUILD_RESULT" skipped
            require_value candidate-image-integration "$CANDIDATE_SUITE_RESULT" skipped
            require_value promote-candidate-image "$PROMOTION_RESULT" skipped
            require_value published-image-integration-readonly               "$PUBLISHED_READONLY_RESULT" skipped
            require_value published-image-integration-trusted               "$PUBLISHED_TRUSTED_RESULT" skipped
          }

          if [[ "$CI_EVENT_NAME" == pull_request_target &&
            "$CI_BRANCH_NAME" == CI/* &&
            -n "$CI_HEAD_REPOSITORY" &&
            "$CI_HEAD_IS_BASE_REPOSITORY" == true ]]; then
            echo "Same-repository CI/** pull request intentionally uses the push-triggered workflow." |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          require_value protected-ci-paths "$PROTECTED_RESULT" success
          require_value ruleset-readback "$RULESET_RESULT" success
          require_value change-classification "$CLASSIFICATION_RESULT" success

          if [[ "$DOCS_ONLY" == true ]]; then
            require_value RUN_INTEGRATION "$RUN_INTEGRATION" false
            require_value ci-image-change "$IMAGE_CHANGE_RESULT" skipped
            require_integration_routes_skipped
            {
              echo "Documentation-only change detected ($CLASSIFICATION_REASON)."
              echo "Build and shared integration DAG were intentionally skipped; healthcheck remains required."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          require_value DOCS_ONLY "$DOCS_ONLY" false
          require_value RUN_INTEGRATION "$RUN_INTEGRATION" true
          require_value ci-image-change "$IMAGE_CHANGE_RESULT" success
          case "$IMAGE_CHANGED" in
            true)
              require_value ci-image-identity "$IMAGE_IDENTITY_RESULT" skipped
              require_value candidate-image-build "$CANDIDATE_BUILD_RESULT" success
              require_value candidate-image-integration "$CANDIDATE_SUITE_RESULT" success
              require_value promote-candidate-image "$PROMOTION_RESULT" success
              require_value published-image-integration-readonly                 "$PUBLISHED_READONLY_RESULT" skipped
              require_value published-image-integration-trusted                 "$PUBLISHED_TRUSTED_RESULT" skipped
              case "$PROMOTION_STATUS" in
                promoted)
                  echo "Build-once candidate integration and same-digest promotion passed." |
                    tee -a "$GITHUB_STEP_SUMMARY"
                  ;;
                superseded)
                  echo "Build-once candidate integration passed; a newer image-input identity superseded mutable-tag promotion." |
                    tee -a "$GITHUB_STEP_SUMMARY"
                  ;;
                *)
                  echo "Promotion completed without a canonical promoted/superseded status." >&2
                  exit 1
                  ;;
              esac
              ;;
            false)
              require_value ci-image-identity "$IMAGE_IDENTITY_RESULT" success
              require_value candidate-image-build "$CANDIDATE_BUILD_RESULT" skipped
              require_value candidate-image-integration "$CANDIDATE_SUITE_RESULT" skipped
              require_value promote-candidate-image "$PROMOTION_RESULT" skipped
              if [[ "$CI_EVENT_NAME" == push ]]; then
                require_value published-image-integration-trusted                   "$PUBLISHED_TRUSTED_RESULT" success
                require_value published-image-integration-readonly                   "$PUBLISHED_READONLY_RESULT" skipped
              else
                require_value published-image-integration-trusted                   "$PUBLISHED_TRUSTED_RESULT" skipped
                require_value published-image-integration-readonly                   "$PUBLISHED_READONLY_RESULT" success
              fi
              echo "Shared published-image integration DAG passed." |
                tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "CI image classification produced '$IMAGE_CHANGED'." >&2
              exit 1
              ;;
          esac
