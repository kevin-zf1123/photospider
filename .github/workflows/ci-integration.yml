name: CI Integration

on:
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main
      - 'CI/**'
  workflow_dispatch:

permissions:
  attestations: read
  contents: read
  packages: read

jobs:
  protected-ci-paths:
    if: >-
      ${{
        github.event_name != 'pull_request_target' ||
        !startsWith(github.head_ref, 'CI/') ||
        github.event.pull_request.head.repo.full_name != github.repository
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject fork CI branch pull request
        if: >-
          ${{
            github.event_name == 'pull_request_target' &&
            startsWith(github.head_ref, 'CI/') &&
            github.event.pull_request.head.repo.full_name != github.repository
          }}
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/protected-ci-paths
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          {
            echo "Fork CI/** pull requests are rejected before checkout."
            echo "Only CI/** branches in '$CI_BASE_REPOSITORY' are covered by the push-triggered workflow."
            echo "Received head repository: '${CI_HEAD_REPOSITORY:-unavailable}'."
          } | tee "$CI_ARTIFACT_DIR/summary.log" >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}

      - name: Protect CI workflow paths
        env:
          CI_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          CI_HEAD_IS_BASE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name == github.repository }}
          CI_BASE_BRANCH: ${{ github.base_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/protected-ci-paths
        run: |
          set -Eeuo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          : > "$CI_ARTIFACT_DIR/changed-files.z"
          : > "$CI_ARTIFACT_DIR/changed-files.txt"
          : > "$CI_ARTIFACT_DIR/protected-files.txt"

          if [[ "$CI_EVENT_NAME" == "push" && "$CI_BRANCH_NAME" == "main" ]]; then
            echo "main branch push may update CI workflow files." |
              tee "$CI_ARTIFACT_DIR/summary.log"
            exit 0
          fi
          if [[ "$CI_BRANCH_NAME" == CI/* &&
            (
              "$CI_EVENT_NAME" == push ||
              "$CI_EVENT_NAME" == workflow_dispatch ||
              (
                "$CI_EVENT_NAME" == pull_request_target &&
                -n "$CI_HEAD_REPOSITORY" &&
                "$CI_HEAD_IS_BASE_REPOSITORY" == true
              )
            ) ]]; then
            echo "CI branch '$CI_BRANCH_NAME' may update CI workflow files." |
              tee "$CI_ARTIFACT_DIR/summary.log"
            exit 0
          fi

          diff_candidate_base=origin/main
          diff_head=HEAD
          if [[ "$CI_EVENT_NAME" == pull_request ||
            "$CI_EVENT_NAME" == pull_request_target ]]; then
            git fetch --no-tags --no-recurse-submodules \
              "https://github.com/${CI_BASE_REPOSITORY}.git" \
              "+refs/heads/${CI_BASE_BRANCH}:refs/remotes/photospider-base/${CI_BASE_BRANCH}"
            diff_candidate_base=$CI_BASE_SHA
            diff_head=$CI_HEAD_SHA
          else
            git fetch --no-tags --prune origin main
          fi

          git rev-parse --verify "$diff_candidate_base^{commit}" >/dev/null
          git rev-parse --verify "$diff_head^{commit}" >/dev/null
          if ! git merge-base --all "$diff_candidate_base" "$diff_head" \
            > "$CI_ARTIFACT_DIR/merge-bases.txt"; then
            echo "Protected-path merge-base detection failed." >&2
            exit 1
          fi
          mapfile -t merge_bases < "$CI_ARTIFACT_DIR/merge-bases.txt"
          if ((${#merge_bases[@]} != 1)); then
            echo "Protected-path comparison requires exactly one merge base." >&2
            exit 1
          fi
          diff_base=${merge_bases[0]}

          if ! git diff --no-renames --name-only -z \
            "$diff_base" "$diff_head" \
            > "$CI_ARTIFACT_DIR/changed-files.z"; then
            echo "Protected-path changed-path detection failed." >&2
            exit 1
          fi
          changed_files=()
          if ! mapfile -d '' -t changed_files \
            < "$CI_ARTIFACT_DIR/changed-files.z"; then
            echo "Protected-path changed-path inventory read failed." >&2
            exit 1
          fi
          for changed_file in "${changed_files[@]}"; do
            printf '%q\n' "$changed_file" \
              >> "$CI_ARTIFACT_DIR/changed-files.txt"
            case "$changed_file" in
              Dockerfile.ci | .dockerignore | ci/* | .github/workflows/*)
                printf '%q\n' "$changed_file" \
                  >> "$CI_ARTIFACT_DIR/protected-files.txt"
                ;;
            esac
          done

          if [[ -s "$CI_ARTIFACT_DIR/protected-files.txt" ]]; then
            {
              echo "Only trusted base-repository CI/** runs may change ci/, .github/workflows/, Dockerfile.ci, or .dockerignore."
              echo "Develop CI workflow changes on a CI/** branch in '$CI_BASE_REPOSITORY'."
            } | tee "$CI_ARTIFACT_DIR/summary.log" >&2
            exit 1
          fi

          echo "No protected CI workflow paths changed on '$CI_BRANCH_NAME'." |
            tee "$CI_ARTIFACT_DIR/summary.log"

      - name: Upload protected path logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-protected-ci-paths
          path: CI-results/protected-ci-paths
          if-no-files-found: warn

  change-classification:
    needs: protected-ci-paths
    if: needs.protected-ci-paths.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_integration: ${{ steps.classify.outputs.run_integration }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pull request base history
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          if ! git fetch --no-tags --no-recurse-submodules \
            "https://github.com/${CI_BASE_REPOSITORY}.git" \
            "+refs/heads/${CI_BASE_BRANCH}:refs/remotes/photospider-base/${CI_BASE_BRANCH}"; then
            echo "Base history fetch failed; classification will require full integration." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Classify changed paths
        id: classify
        env:
          CI_CHANGE_EVENT: ${{ github.event_name }}
          CI_CHANGE_BRANCH: ${{ github.ref_name }}
          CI_CHANGE_BASE_SHA: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.base.sha || github.event.before }}
          CI_CHANGE_HEAD_SHA: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.event_name == 'push' && github.event.after || github.sha }}
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/change-classification
        run: bash ci/scripts/change_classification.sh
      - name: Upload change classification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-change-classification
          path: CI-results/change-classification
          if-no-files-found: warn

  ci-image-change:
    needs: change-classification
    if: >-
      ${{
        needs.change-classification.result == 'success' &&
        needs.change-classification.outputs.run_integration == 'true'
      }}
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pull request base history
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          CI_BASE_REPOSITORY: ${{ github.repository }}
          CI_BASE_BRANCH: ${{ github.base_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --no-recurse-submodules \
            "https://github.com/${CI_BASE_REPOSITORY}.git" \
            "+refs/heads/${CI_BASE_BRANCH}:refs/remotes/photospider-base/${CI_BASE_BRANCH}"
          git rev-parse --verify "$CI_BASE_SHA^{commit}" >/dev/null
      - name: Fetch CI branch main history
        if: github.event_name == 'push' && startsWith(github.ref_name, 'CI/')
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --prune origin main
      - name: Detect CI image input changes
        id: detect
        env:
          CI_IMAGE_BASE_REF: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.base.sha || (github.event_name == 'push' && startsWith(github.ref_name, 'CI/')) && 'origin/main' || github.event.before }}
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/ci-image-change
        run: bash ci/scripts/ci_image_changed.sh
      - name: Upload CI image change logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-ci-image-change
          path: CI-results/ci-image-change
          if-no-files-found: warn

  ci-image-identity:
    needs: ci-image-change
    if: needs.ci-image-change.outputs.changed == 'false'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
      image: ${{ steps.identity.outputs.image }}
      manifest_digest: ${{ steps.identity.outputs.manifest_digest }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image identity
        id: identity
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/ci-image-identity
          CI_IMAGE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/scripts/ci_image_verify.sh
      - name: Upload image identity logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-ci-image-identity
          path: CI-results/ci-image-identity
          if-no-files-found: warn

  integration-plan:
    needs: [change-classification, ci-image-change, ci-image-identity]
    if: >-
      ${{
        needs.change-classification.outputs.run_integration == 'true' &&
        needs.ci-image-change.outputs.changed == 'false' &&
        needs.ci-image-identity.result == 'success'
      }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-image-identity.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Preflight integration inventory
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/integration-plan
        run: bash ci/scripts/integration_plan.sh
      - name: Stage versioned security profile inventory
        run: >-
          bash ci/scripts/ci_profile_inventory_stage.sh
          build/ci-plan/generated/ci_inventory
          CI-results/profile-inventory
      - name: Upload integration plan logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-plan-results
          path: CI-results/integration-plan
          if-no-files-found: warn
      - name: Upload security profile inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-security-profile-inventory
          path: CI-results/profile-inventory
          if-no-files-found: error
          retention-days: 3

  build-integrity-default:
    needs: [integration-plan, ci-image-identity]
    if: needs.integration-plan.result == 'success'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-image-identity.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      build_smoke_matrix: ${{ steps.build.outputs.build_smoke_matrix }}
      matrix_sha256: ${{ steps.identity.outputs.matrix_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Run build integrity
        id: build
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/build-integrity-default
          CI_BUILD_PROFILE: default
        run: bash ci/scripts/build_integrity.sh
      - name: Pack identity-bound reusable build
        id: identity
        env:
          CI_IMAGE_DIGEST: ${{ needs.ci-image-identity.outputs.digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p CI-results/reusable-build-default
          python3 ci/scripts/ci_profile_manifest.py \
            --inventory-dir build/ci/generated/ci_inventory \
            --output CI-results/reusable-build-default/resolved-profile.json
          matrix_sha256=$(python3 -c \
            'import json; print(json.load(open("CI-results/reusable-build-default/resolved-profile.json", encoding="utf-8"))["matrix_sha256"])')
          printf 'matrix_sha256=%s\n' "$matrix_sha256" >> "$GITHUB_OUTPUT"
          python3 ci/scripts/reusable_build.py \
            --inventory-dir build/ci/generated/ci_inventory create \
            --source build/ci \
            --archive CI-results/reusable-build-default/ci-build.tar.gz \
            --manifest CI-results/reusable-build-default/ci-build.manifest.json \
            --candidate-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --profile default \
            --image-digest "$CI_IMAGE_DIGEST" \
            --workflow-commit "${{ github.workflow_sha }}"
      - name: Upload build integrity logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-integrity-default-results
          path: CI-results/build-integrity-default
          if-no-files-found: warn
      - name: Upload reusable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-build-default
          path: CI-results/reusable-build-default
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  attest-reusable-build-default:
    needs: [build-integrity-default, ci-image-identity]
    if: needs.build-integrity-default.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
      - name: Download reusable build candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-build-default
          path: CI-results/reusable-build
      - name: Verify reusable build before attestation
        run: |
          python3 ci/scripts/ci_runner_verify.py --platform Linux
          python3 ci/scripts/reusable_build.py verify-only \
            --archive CI-results/reusable-build/ci-build.tar.gz \
            --manifest CI-results/reusable-build/ci-build.manifest.json \
            --candidate-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --profile default \
            --matrix-sha256 "${{ needs.build-integrity-default.outputs.matrix_sha256 }}" \
            --image-digest "${{ needs.ci-image-identity.outputs.digest }}" \
            --workflow-commit "${{ github.workflow_sha }}"
      - name: Attest reusable build archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: CI-results/reusable-build/ci-build.tar.gz
      - name: Attest reusable build manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: CI-results/reusable-build/ci-build.manifest.json

  local-image-integration:
    needs: [change-classification, ci-image-change]
    if: >-
      ${{
        needs.change-classification.outputs.run_integration == 'true' &&
        needs.ci-image-change.outputs.changed == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}

      - name: Build local CI image
        id: local-image
        env:
          CI_IMAGE_MANIFEST_DIR: ${{ github.workspace }}/CI-results/local-ci-image-identity
        run: |
          set -Eeuo pipefail
          python3 ci/scripts/ci_runner_verify.py --platform Linux
          python3 ci/scripts/ci_lock_verify.py
          mkdir -p "$CI_IMAGE_MANIFEST_DIR"
          source_commit=$(git rev-parse HEAD)
          manifest_digest=$(python3 ci/scripts/ci_image_manifest.py create \
            --source-commit "$source_commit" \
            --repository "${{ github.repository }}" \
            --output "$CI_IMAGE_MANIFEST_DIR/ci-image-input-v1.json" \
            --digest-output "$CI_IMAGE_MANIFEST_DIR/ci-image-input-v1.sha256")
          docker build \
            --build-arg "CI_IMAGE_INPUT_MANIFEST_SHA256=$manifest_digest" \
            --build-arg "CI_IMAGE_SOURCE_COMMIT=$source_commit" \
            -t photospider-ci:local -f Dockerfile.ci .
          docker image inspect --format '{{json .Config.Labels}}' \
            photospider-ci:local > "$CI_IMAGE_MANIFEST_DIR/oci-labels.json"
          python3 ci/scripts/ci_image_manifest.py verify-labels \
            --manifest "$CI_IMAGE_MANIFEST_DIR/ci-image-input-v1.json" \
            --labels-json "$CI_IMAGE_MANIFEST_DIR/oci-labels.json" \
            --source-commit "$source_commit"
          image_id=$(docker image inspect --format '{{.Id}}' photospider-ci:local)
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Local image did not produce an immutable image ID." >&2
            exit 1
          fi
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Run integration suite in local CI image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CI_ARTIFACT_ROOT=/workspace/CI-results \
            -e EXECUTION_REPEAT=5 \
            -e LEGACY_GPU_REPEAT=3 \
            "${{ steps.local-image.outputs.image_id }}" \
            bash ci/scripts/integration_suite.sh

      - name: Run isolated security profiles in local CI image
        run: |
          set -Eeuo pipefail
          for sanitizer in asan tsan; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              -e "SANITIZER=$sanitizer" \
              -e "CI_ARTIFACT_DIR=/workspace/CI-results/sanitizer-$sanitizer" \
              "${{ steps.local-image.outputs.image_id }}" \
              bash ci/scripts/sanitizer_test.sh
          done
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CI_ARTIFACT_DIR=/workspace/CI-results/fuzz-codecs \
            "${{ steps.local-image.outputs.image_id }}" \
            bash ci/scripts/fuzz_smoke.sh

      - name: Upload local image integration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-local-image-results
          path: CI-results
          if-no-files-found: warn

  full-ctest:
    needs: [integration-plan, build-integrity-default, attest-reusable-build-default, ci-image-identity]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-image-identity.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          submodules: recursive
