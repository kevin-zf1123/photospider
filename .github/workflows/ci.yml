name: kernel-ci

on:
  push:
  pull_request:

env:
  CC: clang
  CXX: clang++

jobs:
  build-test-package:
    name: build-test-package (${{ matrix.os }}, shared=${{ matrix.build_shared_libs }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_shared_libs: ["OFF", "ON"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify Clang
        run: |
          "$CC" --version
          "$CXX" --version
      - name: Verify Ninja
        run: ninja --version
      - name: Prepare CLI JSON dependency
        run: |
          mkdir -p third_party/yyjson
          upstream=https://raw.githubusercontent.com/ibireme/yyjson/6447536015f3d600f3d65323b10976103b337ca7
          curl --fail --location --retry 3 "$upstream/src/yyjson.c" --output third_party/yyjson/yyjson.c
          curl --fail --location --retry 3 "$upstream/src/yyjson.h" --output third_party/yyjson/yyjson.h
          curl --fail --location --retry 3 "$upstream/LICENSE" --output third_party/yyjson/LICENSE
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DPHOTOSPIDER_BUILD_OPS=OFF
          -DBUILD_SHARED_LIBS=${{ matrix.build_shared_libs }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit kernel-ctest.xml

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Clang
        run: |
          "$CC" --version
          "$CXX" --version
      - name: Verify Ninja
        run: ninja --version
      - name: Prepare CLI JSON dependency
        run: |
          mkdir -p third_party/yyjson
          upstream=https://raw.githubusercontent.com/ibireme/yyjson/6447536015f3d600f3d65323b10976103b337ca7
          curl --fail --location --retry 3 "$upstream/src/yyjson.c" --output third_party/yyjson/yyjson.c
          curl --fail --location --retry 3 "$upstream/src/yyjson.h" --output third_party/yyjson/yyjson.h
          curl --fail --location --retry 3 "$upstream/LICENSE" --output third_party/yyjson/LICENSE
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DPHOTOSPIDER_BUILD_OPS=OFF
          -DPHOTOSPIDER_ENABLE_${{ matrix.sanitizer }}=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
