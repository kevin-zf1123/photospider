name: kernel-ci

on:
  push:
  pull_request:

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test and installed consumer
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit kernel-ctest.xml

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DPHOTOSPIDER_ENABLE_${{ matrix.sanitizer }}=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
