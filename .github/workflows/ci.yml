name: kernel-ci

on:
  push:
  pull_request:

jobs:
  build-test-package:
    name: build-test-package (${{ matrix.os }}, shared=${{ matrix.build_shared_libs }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_shared_libs: ["OFF", "ON"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify Ninja
        run: ninja --version
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DBUILD_SHARED_LIBS=${{ matrix.build_shared_libs }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test and installed consumer
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit kernel-ctest.xml

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Ninja
        run: ninja --version
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DPHOTOSPIDER_ENABLE_${{ matrix.sanitizer }}=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
