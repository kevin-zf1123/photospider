name: CI

on:
  push:
    branches:
      - main
      - 'CI/**'

permissions:
  contents: read
  packages: read

env:
  CI_BUILD_TYPE: RelWithDebInfo
  CI_CACHE_EPOCH: v1
  CI_PARALLEL_LEVEL: 2

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}/photospider-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Configure Git access to checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}'

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

      - name: Configure healthcheck tree
        run: >-
          cmake -S . -B build/healthcheck -G Ninja
          -DCMAKE_BUILD_TYPE=${CI_BUILD_TYPE}
          -DBUILD_TESTING=ON
          -DUSE_ASAN=OFF
          -DUSE_TSAN=OFF
          -DPHOTOSPIDER_BUILD_FUZZERS=OFF

      - name: Build public header self-containment
        run: >-
          cmake --build build/healthcheck
          --target public_header_self_containment
          --parallel ${CI_PARALLEL_LEVEL}

  build:
    needs: healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository }}/photospider-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore incremental build tree
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: build/ci
          key: >-
            photospider-${{ env.CI_CACHE_EPOCH }}-${{ runner.os }}-${{ env.CI_BUILD_TYPE }}-${{ hashFiles('Dockerfile.ci', '**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            photospider-${{ env.CI_CACHE_EPOCH }}-${{ runner.os }}-${{ env.CI_BUILD_TYPE }}-${{ hashFiles('Dockerfile.ci', '**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}-
            photospider-${{ env.CI_CACHE_EPOCH }}-${{ runner.os }}-${{ env.CI_BUILD_TYPE }}-${{ hashFiles('Dockerfile.ci', '**/CMakeLists.txt', 'cmake/**') }}-

      - name: Report incremental cache match
        run: >-
          printf 'Exact current-run build-cache hit: %s\n'
          '${{ steps.build-cache.outputs.cache-hit }}'

      - name: Configure cached build tree
        run: >-
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci" -G Ninja
          -DCMAKE_BUILD_TYPE=${CI_BUILD_TYPE}
          -DBUILD_TESTING=ON
          -DUSE_ASAN=OFF
          -DUSE_TSAN=OFF
          -DPHOTOSPIDER_BUILD_FUZZERS=OFF

      - name: Build once
        run: >-
          cmake --build "$GITHUB_WORKSPACE/build/ci"
          --parallel ${CI_PARALLEL_LEVEL}

      - name: Remove cache-restored JUnit residue
        run: rm -rf -- "$GITHUB_WORKSPACE/build/ci/CI-results"

      - name: Package CTest runtime
        run: >-
          bash ci/scripts/package_ctest_runtime.sh
          "$GITHUB_WORKSPACE/build/ci"
          "$GITHUB_WORKSPACE/CI-results/ctest-runtime.tar.gz"

      - name: Save current-run producer build tree
        uses: actions/cache/save@v6
        with:
          path: build/ci
          key: >-
            photospider-${{ env.CI_CACHE_EPOCH }}-${{ runner.os }}-${{ env.CI_BUILD_TYPE }}-${{ hashFiles('Dockerfile.ci', '**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload CTest runtime
        uses: actions/upload-artifact@v7
        with:
          name: ctest-runtime
          path: CI-results/ctest-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-smoke:
    name: Build smoke (${{ matrix.test }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: dependency-disabled-install
            test: DependencyDisabledInstallSmoke
          - artifact: openexr-deep-provider-option-off
            test: OpenExrDeepProviderOptionOffSmoke
          - artifact: static-product-consumer
            test: StaticProductConsumerSmoke
          - artifact: photospiderd-install-layout
            test: PhotospiderdInstallLayoutSmoke
          - artifact: ipc-disabled-install
            test: IpcDisabledInstallSmoke
          - artifact: image-artifact-codec-dependency-disabled-build
            test: ImageArtifactCodecDependencyDisabledBuild
          - artifact: opencv-operation-provider-disabled-build
            test: OpenCvOperationProviderDisabledBuild
          - artifact: public-header-self-containment
            test: PublicHeaderSelfContainment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}/photospider-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Restore exact producer build tree
        id: producer-build-cache
        uses: actions/cache/restore@v6
        with:
          path: build/ci
          key: >-
            photospider-${{ env.CI_CACHE_EPOCH }}-${{ runner.os }}-${{ env.CI_BUILD_TYPE }}-${{ hashFiles('Dockerfile.ci', '**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Require exact producer cache handoff
        env:
          PRODUCER_CACHE_HIT: >-
            ${{ steps.producer-build-cache.outputs.cache-hit }}
        run: |
          if [[ "$PRODUCER_CACHE_HIT" != "true" ]]; then
            printf '%s\n' \
              "Expected exact producer cache handoff for this workflow run; cache-hit='$PRODUCER_CACHE_HIT'." \
              >&2
            exit 1
          fi

      - name: Reconfigure restored producer build tree
        run: >-
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci" -G Ninja
          -DCMAKE_BUILD_TYPE=${CI_BUILD_TYPE}
          -DBUILD_TESTING=ON
          -DUSE_ASAN=OFF
          -DUSE_TSAN=OFF
          -DPHOTOSPIDER_BUILD_FUZZERS=OFF

      - name: Run selected build smoke
        run: |
          junit_dir="$GITHUB_WORKSPACE/CI-results/build-smoke"
          mkdir -p "$junit_dir"
          ctest --test-dir "$GITHUB_WORKSPACE/build/ci" \
            --output-on-failure \
            --tests-regex '^${{ matrix.test }}$' \
            --label-regex '^build-smoke$' \
            --no-tests=error \
            --output-junit "${junit_dir}/${{ matrix.artifact }}.junit.xml"

      - name: Upload selected build-smoke JUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-junit-build-smoke-${{ matrix.artifact }}
          path: >-
            CI-results/build-smoke/${{ matrix.artifact }}.junit.xml
          if-no-files-found: warn
          retention-days: 7

  test:
    name: CTest (${{ matrix.label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        label:
          - unit
          - integration
          - verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}/photospider-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download CTest runtime
        uses: actions/download-artifact@v8
        with:
          name: ctest-runtime
          path: CI-results/runtime

      - name: Restore CTest runtime
        run: |
          mkdir -p build
          tar -C build -xzf CI-results/runtime/ctest-runtime.tar.gz
          test -f build/ci/CTestTestfile.cmake

      - name: Run labelled CTest
        run: |
          junit_dir="$GITHUB_WORKSPACE/CI-results/ctest"
          mkdir -p "$junit_dir"
          ctest --test-dir build/ci \
            --output-on-failure \
            --parallel "${CI_PARALLEL_LEVEL}" \
            --label-regex '^${{ matrix.label }}$' \
            --output-junit "${junit_dir}/${{ matrix.label }}.junit.xml"

      - name: Upload labelled CTest JUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-junit-${{ matrix.label }}
          path: CI-results/ctest/${{ matrix.label }}.junit.xml
          if-no-files-found: warn
          retention-days: 7
