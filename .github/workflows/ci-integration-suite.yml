name: CI Integration Suite

# GitHub validates the permission ceiling of a called workflow before a job's
# `if` can skip it. Every execution job therefore declares its own read-only
# token; only the conditionally selected attestation job inherits the trusted
# caller's write grants.

on:
  workflow_call:
    inputs:
      caller_event:
        description: Exact top-level event name selected by the protected caller.
        required: true
        type: string
      caller_ref:
        description: Exact top-level GitHub ref selected by the protected caller.
        required: true
        type: string
      candidate_commit:
        description: Exact candidate commit tested by every suite job.
        required: true
        type: string
      checkout_ref:
        description: Exact immutable checkout ref for the candidate.
        required: true
        type: string
      checkout_repository:
        description: Exact owner/name checkout repository.
        required: true
        type: string
      image_digest:
        description: Independently expected immutable OCI digest.
        required: true
        type: string
      image_kind:
        description: Either published or candidate.
        required: true
        type: string
      image_manifest_digest:
        description: Canonical CI-image input manifest SHA-256.
        required: true
        type: string
      image_ref:
        description: Exact digest-qualified GHCR image reference.
        required: true
        type: string
      image_source_commit:
        description: Canonical image-input-changing source commit.
        required: true
        type: string
      profile:
        description: Exact shared build profile identity.
        required: true
        type: string
      publish_reusable_attestations:
        description: Whether this trusted push may publish reusable-build attestations.
        required: true
        type: boolean
      workflow_commit:
        description: Exact protected caller workflow commit.
        required: true
        type: string
    outputs:
      validated_image_digest:
        description: Digest consumed successfully by the complete shared DAG.
        value: ${{ jobs.suite-gate.outputs.validated_image_digest }}

jobs:
  identity-preflight:
    permissions:
      attestations: read
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        name: Checkout protected reusable workflow control
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          fetch-depth: 0
          ref: ${{ inputs.workflow_commit }}
          path: .ci-protected-control
      - name: Authenticate exact GHCR identity reader
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reusable integration caller identity
        id: verify
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/called-image-identity
          CI_CALLER_EVENT: ${{ inputs.caller_event }}
          CI_CALLER_REF: ${{ inputs.caller_ref }}
          CI_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CI_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          CI_CHECKOUT_REPOSITORY: ${{ inputs.checkout_repository }}
          CI_EXPECTED_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_EXPECTED_EVENT: ${{ github.event_name }}
          CI_EXPECTED_REF: ${{ github.ref }}
          CI_EXPECTED_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CI_EXPECTED_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          CI_IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_IMAGE_EXPECTED_DIGEST: ${{ inputs.image_digest }}
          CI_IMAGE_EXPECTED_MANIFEST_DIGEST: ${{ inputs.image_manifest_digest }}
          CI_IMAGE_EXPECTED_SOURCE_COMMIT: ${{ inputs.image_source_commit }}
          CI_IMAGE_EXPECTED_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          CI_IMAGE_KIND: ${{ inputs.image_kind }}
          CI_IMAGE_LOCATOR: ${{ inputs.image_ref }}
          CI_IMAGE_MANIFEST_DIGEST: ${{ inputs.image_manifest_digest }}
          CI_IMAGE_REPOSITORY: ${{ github.repository }}
          CI_IMAGE_REF: ${{ inputs.image_ref }}
          CI_IMAGE_SOURCE_COMMIT: ${{ inputs.image_source_commit }}
          CI_PROFILE: ${{ inputs.profile }}
          CI_PUBLISH_REUSABLE_ATTESTATIONS: ${{ inputs.publish_reusable_attestations }}
          CI_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # @brief Require one protected reusable-workflow identity to match.
          # @param $1 Stable diagnostic label.
          # @param $2 Actual caller value.
          # @param $3 Expected GitHub-context value.
          # @return Zero for an exact match, otherwise one.
          require_identity() {
            local label=$1
            local actual=$2
            local expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "$label differs from the protected caller context." >&2
              return 1
            fi
          }

          require_identity caller_event "$CI_CALLER_EVENT" "$CI_EXPECTED_EVENT"
          require_identity caller_ref "$CI_CALLER_REF" "$CI_EXPECTED_REF"
          require_identity candidate_commit "$CI_CANDIDATE_COMMIT" "$CI_EXPECTED_CANDIDATE"
          require_identity checkout_ref "$CI_CHECKOUT_REF" "$CI_EXPECTED_CANDIDATE"
          require_identity checkout_repository "$CI_CHECKOUT_REPOSITORY" "$CI_EXPECTED_REPOSITORY"
          require_identity workflow_commit "$CI_WORKFLOW_COMMIT" "$CI_EXPECTED_WORKFLOW_COMMIT"
          if [[ ! "$CI_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ||
            ! "$CI_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ||
            ! "$CI_IMAGE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ||
            ! "$CI_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ||
            ! "$CI_IMAGE_MANIFEST_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Reusable integration identity is non-canonical." >&2
            exit 1
          fi
          require_identity image_ref "$CI_IMAGE_REF"             "ghcr.io/$GITHUB_REPOSITORY/photospider-ci@$CI_IMAGE_DIGEST"
          require_identity profile "$CI_PROFILE" default
          case "$CI_IMAGE_KIND" in
            candidate)
              require_identity candidate_source                 "$CI_IMAGE_SOURCE_COMMIT" "$CI_CANDIDATE_COMMIT"
              if [[ "$CI_CALLER_EVENT" != push ||
                ("$CI_CALLER_REF" != refs/heads/main &&
                 "$CI_CALLER_REF" != refs/heads/CI/*) ]]; then
                echo "Candidate images require a trusted main or CI/** push." >&2
                exit 1
              fi
              ;;
            published)
              ;;
            *)
              echo "Unknown reusable integration image kind: $CI_IMAGE_KIND" >&2
              exit 1
              ;;
          esac
          if [[ "$CI_PUBLISH_REUSABLE_ATTESTATIONS" == true ]]; then
            if [[ "$CI_CALLER_EVENT" != push ]]; then
              echo "Only trusted pushes may publish reusable-build attestations." >&2
              exit 1
            fi
          elif [[ "$CI_PUBLISH_REUSABLE_ATTESTATIONS" != false ]]; then
            echo "Reusable-build attestation mode is not boolean." >&2
            exit 1
          fi
          bash .ci-protected-control/ci/scripts/ci_image_verify.sh

  integration-plan:
    permissions:
      contents: read
      packages: read
    needs: identity-preflight
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout_repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.checkout_ref }}
      - name: Preflight integration inventory
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/integration-plan
        run: bash ci/scripts/integration_plan.sh
      - name: Stage versioned security profile inventory
        run: >-
          bash ci/scripts/ci_profile_inventory_stage.sh
          build/ci-plan/generated/ci_inventory
          CI-results/profile-inventory
      - name: Upload integration plan logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-plan-results
          path: CI-results/integration-plan
          if-no-files-found: warn
      - name: Upload security profile inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-security-profile-inventory
          path: CI-results/profile-inventory
          if-no-files-found: error
          retention-days: 3

  build-integrity-default:
    permissions:
      contents: read
      packages: read
    needs: integration-plan
    if: needs.integration-plan.result == 'success'
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      build_smoke_matrix: ${{ steps.build.outputs.build_smoke_matrix }}
      dedicated_build_smoke_matrix: ${{ steps.build.outputs.dedicated_build_smoke_matrix }}
      matrix_sha256: ${{ steps.identity.outputs.matrix_sha256 }}
      openexr_build_smoke_matrix: ${{ steps.build.outputs.openexr_build_smoke_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout_repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.checkout_ref }}
      - name: Run same-tree build integrity and producer-local smokes
        id: build
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/build-integrity-default
          CI_BUILD_PROFILE: default
        run: bash ci/scripts/build_integrity.sh
      - name: Pack role-specific identity-bound artifacts
        id: identity
        env:
          CI_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          artifact_root=CI-results/targeted-artifacts
          mkdir -p "$artifact_root"/{ctest-control,ctest-runtime,installed-package,openexr-metadata}
          python3 ci/scripts/ci_profile_manifest.py \
            --inventory-dir build/ci/generated/ci_inventory \
            --output "$artifact_root/resolved-profile.json"
          matrix_sha256=$(python3 -c \
            'import json; print(json.load(open("CI-results/targeted-artifacts/resolved-profile.json", encoding="utf-8"))["matrix_sha256"])')
          printf 'matrix_sha256=%s\n' "$matrix_sha256" >> "$GITHUB_OUTPUT"
          for role in ctest-control ctest-runtime openexr-metadata; do
            python3 ci/scripts/reusable_build.py \
              --inventory-dir build/ci/generated/ci_inventory create-targeted \
              --source build/ci \
              --role "$role" \
              --archive "$artifact_root/$role/$role.tar.gz" \
              --manifest "$artifact_root/$role/$role.manifest.json" \
              --candidate-commit "${{ inputs.candidate_commit }}" \
              --profile default \
              --image-digest "$CI_IMAGE_DIGEST" \
              --workflow-commit "${{ inputs.workflow_commit }}"
          done
          python3 ci/scripts/reusable_build.py \
            --inventory-dir build/ci/generated/ci_inventory create-targeted \
            --source build/ci \
            --payload-source CI-results/installed-prefix-default \
            --role installed-package \
            --archive "$artifact_root/installed-package/installed-package.tar.gz" \
            --manifest "$artifact_root/installed-package/installed-package.manifest.json" \
            --candidate-commit "${{ inputs.candidate_commit }}" \
            --profile default \
            --image-digest "$CI_IMAGE_DIGEST" \
            --workflow-commit "${{ inputs.workflow_commit }}"
          python3 - "$artifact_root" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          summary = {}
          for role in (
              "ctest-control",
              "ctest-runtime",
              "installed-package",
              "openexr-metadata",
          ):
              manifest = json.loads(
                  (root / role / f"{role}.manifest.json").read_text(encoding="utf-8")
              )
              summary[role] = {
                  "archive_size": manifest["artifact"]["size"],
                  "member_count": len(manifest["content"]["members"]),
                  "uncompressed_size": manifest["content"]["uncompressed_size"],
              }
          (root / "targeted-artifact-sizes.json").write_text(
              json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload build integrity logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-integrity-default-results
          path: |
            CI-results/build-integrity-default
            CI-results/targeted-artifacts/targeted-artifact-sizes.json
          if-no-files-found: warn
      - name: Upload CTest control artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-control-default
          path: CI-results/targeted-artifacts/ctest-control
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload CTest runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-runtime-default
          path: CI-results/targeted-artifacts/ctest-runtime
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload installed package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-installed-package-default
          path: CI-results/targeted-artifacts/installed-package
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload OpenEXR metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-openexr-metadata-default
          path: CI-results/targeted-artifacts/openexr-metadata
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  verify-targeted-artifacts:
    permissions:
      contents: read
    needs: build-integrity-default
    if: needs.build-integrity-default.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout_repository }}
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}
      - name: Download CTest control artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-control-default
          path: CI-results/targeted-artifacts/ctest-control
      - name: Download CTest runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-runtime-default
          path: CI-results/targeted-artifacts/ctest-runtime
      - name: Download installed package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-installed-package-default
          path: CI-results/targeted-artifacts/installed-package
      - name: Download OpenEXR metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-openexr-metadata-default
          path: CI-results/targeted-artifacts/openexr-metadata
      - name: Verify every targeted role before attestation
        env:
          CI_MATRIX_SHA256: ${{ needs.build-integrity-default.outputs.matrix_sha256 }}
          CI_RUNNER_IDENTITY_FILE: ${{ runner.temp }}/photospider-targeted-verifier-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -Eeuo pipefail
          python3 ci/scripts/ci_runner_verify.py \
            --platform Linux \
            --runner-label ubuntu-24.04 \
            --output "$CI_RUNNER_IDENTITY_FILE"
          for role in ctest-control ctest-runtime installed-package openexr-metadata; do
            python3 ci/scripts/reusable_build.py verify-targeted-only \
              --archive "CI-results/targeted-artifacts/$role/$role.tar.gz" \
              --manifest "CI-results/targeted-artifacts/$role/$role.manifest.json" \
              --role "$role" \
              --candidate-commit "${{ inputs.candidate_commit }}" \
              --profile default \
              --matrix-sha256 "$CI_MATRIX_SHA256" \
              --image-digest "${{ inputs.image_digest }}" \
              --workflow-commit "${{ inputs.workflow_commit }}"
          done

  attest-targeted-artifacts:
    needs: [build-integrity-default, verify-targeted-artifacts]
    if: >-
      ${{
        inputs.publish_reusable_attestations &&
        needs.verify-targeted-artifacts.result == 'success'
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all targeted artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-*-default
          path: CI-results/targeted-artifacts
          merge-multiple: false
      - name: Attest exact targeted archives and manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            CI-results/targeted-artifacts/**/*.tar.gz
            CI-results/targeted-artifacts/**/*.manifest.json

  targeted-artifacts-ready:
    permissions: {}
    needs: [verify-targeted-artifacts, attest-targeted-artifacts]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact verification and trust-scoped attestation result
        env:
          CI_ATTESTATION_RESULT: ${{ needs.attest-targeted-artifacts.result }}
          CI_PUBLISH_REUSABLE_ATTESTATIONS: ${{ inputs.publish_reusable_attestations }}
          CI_VERIFICATION_RESULT: ${{ needs.verify-targeted-artifacts.result }}
        run: |
          set -Eeuo pipefail
          [[ "$CI_VERIFICATION_RESULT" == success ]]
          if [[ "$CI_PUBLISH_REUSABLE_ATTESTATIONS" == true ]]; then
            [[ "$CI_ATTESTATION_RESULT" == success ]]
          else
            [[ "$CI_ATTESTATION_RESULT" == skipped ]]
          fi

  full-ctest:
    permissions:
      attestations: read
      contents: read
      packages: read
    needs: [integration-plan, build-integrity-default, targeted-artifacts-ready]
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout_repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.checkout_ref }}
      - name: Download CTest runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-runtime-default
          path: CI-results/targeted-artifact
      - name: Verify and restore CTest runtime artifact
        env:
          CI_ARTIFACT_ROLE: ctest-runtime
          CI_BUILD_PROFILE: default
          CI_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CI_IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_MATRIX_SHA256: ${{ needs.build-integrity-default.outputs.matrix_sha256 }}
          CI_REQUIRE_REMOTE_ATTESTATION: ${{ inputs.publish_reusable_attestations }}
          CI_TARGETED_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/targeted-artifact
          CI_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/scripts/targeted_artifact_consume.sh
      - name: Run full ctest
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/ctest-full
          CI_REUSE_BUILD: ON
        run: bash ci/scripts/ctest_full.sh
      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctest-full-results
          path: CI-results/ctest-full
          if-no-files-found: warn

  build-smoke:
    permissions:
      attestations: read
      contents: read
      packages: read
    name: Build smoke (${{ matrix.test }})
    needs: [integration-plan, build-integrity-default, targeted-artifacts-ready]
    if: >-
      needs.integration-plan.result == 'success' &&
      needs.build-integrity-default.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-integrity-default.outputs.build_smoke_matrix || '{"include":[]}') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout_repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.checkout_ref }}
      - name: Download CTest control artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-control-default
          path: CI-results/targeted-artifact
      - name: Verify and restore CTest control artifact
        env:
          CI_ARTIFACT_ROLE: ${{ matrix.artifact_role }}
          CI_BUILD_PROFILE: default
          CI_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CI_IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_MATRIX_SHA256: ${{ needs.build-integrity-default.outputs.matrix_sha256 }}
          CI_REQUIRE_REMOTE_ATTESTATION: ${{ inputs.publish_reusable_attestations }}
          CI_TARGETED_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/targeted-artifact
          CI_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/scripts/targeted_artifact_consume.sh
      - name: Run labelled build smoke
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/CI-results/build-smoke/${{ matrix.artifact }}
          CI_ARTIFACT_ROLE: ${{ matrix.artifact_role }}
          CI_BUILD_PROFILE: default
          CI_REUSE_BUILD: ON
          SMOKE_TEST_NAME: ${{ matrix.test }}
        run: bash ci/scripts/build_smoke_test.sh
      - name: Upload build smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-smoke-${{ matrix.artifact }}-results
          path: CI-results/build-smoke/${{ matrix.artifact }}
          if-no-files-found: warn

  openexr-smoke:
    permissions:
      attestations: read
      contents: read
      packages: read
    name: OpenEXR metadata smoke (${{ matrix.test }})
    needs: [integration-plan, build-integrity-default, targeted-artifacts-ready]
    if: >-
      needs.integration-plan.result == 'success' &&
      needs.build-integrity-default.result == 'success' &&
      needs.targeted-artifacts-ready.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-integrity-default.outputs.openexr_build_smoke_matrix || '{"include":[]}') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout_repository }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.checkout_ref }}
      - name: Download OpenEXR metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-openexr-metadata-default
          path: CI-results/targeted-artifact
      - name: Verify OpenEXR metadata artifact
        env:
          CI_ARTIFACT_ROLE: ${{ matrix.artifact_role }}
          CI_BUILD_PROFILE: default
          CI_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CI_IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_MATRIX_SHA256: ${{ needs.build-integrity-default.outputs.matrix_sha256 }}
