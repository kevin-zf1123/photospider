  suite-gate:
    permissions:
      contents: read
    needs:
      - identity-preflight
      - integration-plan
      - build-integrity-default
      - build-smoke-control
      - verify-targeted-artifacts
      - attest-targeted-artifacts
      - targeted-artifacts-ready
      - full-ctest
      - build-smoke
      - producer-build-smoke
      - openexr-smoke
      - scripted-cli
      - propagation-script
      - plugin-load
      - execution-repeat
      - installed-package-consumer
      - sanitizer-asan
      - sanitizer-tsan
      - fuzz-codecs
      - sanitizer-asan-darwin
      - sanitizer-tsan-darwin
      - fuzz-codecs-darwin
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      validated_image_digest: ${{ steps.aggregate.outputs.validated_image_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        name: Checkout protected suite gate control
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          sparse-checkout: ci/scripts/integration_suite_gate.py
          sparse-checkout-cone-mode: false
          path: .ci-suite-gate-control
      - name: Aggregate the exact shared integration DAG
        id: aggregate
        env:
          CI_ARTIFACT_READY_RESULT: ${{ needs.targeted-artifacts-ready.result }}
          CI_ASAN_RESULT: ${{ needs.sanitizer-asan.result }}
          CI_ATTESTATION_RESULT: ${{ needs.attest-targeted-artifacts.result }}
          CI_BUILD_RESULT: ${{ needs.build-integrity-default.result }}
          CI_BUILD_SMOKE_CONTROL_RESULT: ${{ needs.build-smoke-control.result }}
          CI_BUILD_SMOKE_RESULT: ${{ needs.build-smoke.result }}
          CI_CTEST_RESULT: ${{ needs.full-ctest.result }}
          CI_DARWIN_ASAN_RESULT: ${{ needs.sanitizer-asan-darwin.result }}
          CI_DARWIN_FUZZ_RESULT: ${{ needs.fuzz-codecs-darwin.result }}
          CI_DARWIN_TSAN_RESULT: ${{ needs.sanitizer-tsan-darwin.result }}
          CI_EXECUTION_RESULT: ${{ needs.execution-repeat.result }}
          CI_FUZZ_RESULT: ${{ needs.fuzz-codecs.result }}
          CI_IDENTITY_RESULT: ${{ needs.identity-preflight.result }}
          CI_IMAGE_DIGEST: ${{ needs.identity-preflight.outputs.image_digest }}
          CI_INSTALLED_PACKAGE_RESULT: ${{ needs.installed-package-consumer.result }}
          CI_OPENEXR_RESULT: ${{ needs.openexr-smoke.result }}
          CI_PLAN_RESULT: ${{ needs.integration-plan.result }}
          CI_PLUGIN_RESULT: ${{ needs.plugin-load.result }}
          CI_PRODUCER_BUILD_SMOKE_RESULT: ${{ needs.producer-build-smoke.result }}
          CI_PUBLISH_REUSABLE_ATTESTATIONS: ${{ inputs.publish_reusable_attestations }}
          CI_PROPAGATION_RESULT: ${{ needs.propagation-script.result }}
          CI_SCRIPTED_CLI_RESULT: ${{ needs.scripted-cli.result }}
          CI_TSAN_RESULT: ${{ needs.sanitizer-tsan.result }}
          CI_ROUTE_SHA256: ${{ needs.build-smoke-control.outputs.route_sha256 }}
          CI_VERIFY_RESULT: ${{ needs.verify-targeted-artifacts.result }}
        run: >-
          python3 .ci-suite-gate-control/ci/scripts/integration_suite_gate.py
          --output "$GITHUB_OUTPUT"
